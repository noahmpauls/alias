<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/ui/css/style.css">
  <link rel="stylesheet" href="/ui/css/import.css">
  <script type="module" src="/bin/components.js"></script>
  <script type="module" src="/bin/import.js"></script>
  <title>Import Aliases</title>
</head>
<body>
  <lit-alias-pages default="file">

    <lit-alias-file-importer data-page="file"></lit-alias-file-importer>

    <lit-alias-data-importer data-page="data" class="flex-stack" style="--g: 1rem;"></lit-alias-data-importer>

    <div data-page="complete" id="import-complete" class="center-col flex-stack" style="--g: 1rem;">
      <h2 style="text-align: center;">Import complete!</h2>
      <p style="text-align: center;">You can close this window.</p>
    </div>

  </lit-alias-pages>
</body>
</html>
